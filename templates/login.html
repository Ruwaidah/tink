{% extends 'base.html' %}

{% block title %}
Login | Tink
{% endblock %}

{% block content %}
<main>
    <h1>Login</h1>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label for="email">
            Email
        </label>

        <input id="email" name="email" type="email" required>

        <label for="password">
            Password
        </label>

        <input id="password" name="password" type="password" required>

        <button type="submit">
            Login
        </button>
        <a href="{{url_for('home')}}">Cancel</a>
    </form>
</main>
{% endblock %}
