<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    {% block styles %}
    {% endblock %}

    <title>
        {% block title %}
        Tink
        {% endblock %}
    </title>
</head>

<body>

    <nav class="main-nav">

        <a href="{{ url_for('home') }}">
            Home
        </a>

        <a href="{{ url_for('games') }}">
            Games
        </a>

        <a href="{{ url_for('score.leaderboard') }}">
            Leaderboard
        </a>

        {% if session.get('user_id') %}

        <a href="{{ url_for('score.scores') }}">
            My Scores
        </a>

        <span>
            Welcome, {{ session.get('username') }}
        </span>

        <a href="{{ url_for('auth.logout') }}">
            Logout
        </a>

        {% else %}

        <a href="{{ url_for('auth.login') }}">
            Login
        </a>

        <a href="{{ url_for('auth.register') }}">
            Create Account
        </a>

        {% endif %}

    </nav>


    {% block content %}
    {% endblock %}


    {% block scripts %}
    {% endblock %}

</body>

</html>
